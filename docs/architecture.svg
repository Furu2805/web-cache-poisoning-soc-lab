<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="t d">
<title id="t">Web Cache Poisoning Detection Lab Architecture</title>
<desc id="d">Local clients send requests through Nginx shared cache to a storefront. Nginx inspects requests through a baseline detector, which asynchronously sends allowlisted metadata to a route-aware ML shadow service. Sanitized events flow through Alloy and Loki to Grafana and automatic evidence correlation. The SOC case queue groups matching alerts, tracks analyst status, notes, mitigation review, evidence timeline and audit trail, and cannot enforce cache actions.</desc>
<defs>
 <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
 <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
 <style>
 .bg{fill:#f7f9fc}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18}.blue{stroke:#2563eb}.green{stroke:#059669}.purple{stroke:#7c3aed}.teal{stroke:#0f766e}
 .title{font:700 29px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.sub{font:15px 'Segoe UI',Arial,sans-serif;fill:#475569}.h{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.b{font:14px 'Segoe UI',Arial,sans-serif;fill:#334155}.s{font:12px 'Segoe UI',Arial,sans-serif;fill:#64748b}
 .line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#a)}.async{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#p)}
 .pill{font:700 11px 'Segoe UI',Arial,sans-serif;letter-spacing:.4px}.pb{fill:#dbeafe}.pg{fill:#d1fae5}.pp{fill:#ede9fe}.pt{fill:#ccfbf1}.tb{fill:#1d4ed8}.tg{fill:#047857}.tp{fill:#6d28d9}.tt{fill:#0f766e}
 </style>
</defs>
<rect class="bg" width="1440" height="850"/>
<text class="title" x="54" y="54">Web Cache Poisoning Detection &amp; Monitoring Lab</text>
<text class="sub" x="54" y="82">Local Docker environment · baseline decisions remain authoritative · ML candidates run shadow-only</text>

<rect class="card" x="55" y="145" width="230" height="120"/><text class="h" x="80" y="185">Client / Replay</text><text class="b" x="80" y="215">Browser · Burp · traffic</text><text class="s" x="80" y="240">safe local requests</text>
<rect class="card green" x="365" y="130" width="340" height="150"/><text class="h" x="395" y="175">Nginx shared cache</text><text class="b" x="395" y="205">8086 · vulnerable lab, detector off</text><text class="b" x="395" y="230">8090 · observe mode</text><rect class="pg" x="395" y="245" width="112" height="21" rx="10"/><text class="pill tg" x="408" y="260">CACHE PATH</text>
<rect class="card" x="785" y="145" width="270" height="120"/><text class="h" x="815" y="185">Fusion storefront</text><text class="b" x="815" y="215">React · Node · MongoDB</text><text class="s" x="815" y="240">local vulnerable origin</text>
<path class="line" d="M285 205H360"/><path class="line" d="M705 205H780"/>

<rect class="card blue" x="190" y="360" width="355" height="145"/><text class="h" x="220" y="400">Baseline Detection API</text><text class="b" x="220" y="430">inspection · profile · current recommendation</text><text class="b" x="220" y="455">synchronous request path</text><rect class="pb" x="220" y="470" width="145" height="22" rx="11"/><text class="pill tb" x="233" y="485">AUTHORITATIVE</text>
<rect class="card purple" x="640" y="360" width="375" height="145"/><text class="h" x="670" y="400">ML Shadow Service</text><text class="b" x="670" y="430">per-route features · models · thresholds</text><text class="b" x="670" y="455">bounded queue · microbatch · checksum guard</text><rect class="pp" x="670" y="470" width="125" height="22" rx="11"/><text class="pill tp" x="684" y="485">SHADOW ONLY</text>
<rect class="card" x="1100" y="375" width="270" height="115"/><text class="h" x="1130" y="415">Sanitized JSONL</text><text class="b" x="1130" y="445">request ID · scores · status</text><text class="s" x="1130" y="468">no raw payload or credentials</text>
<path class="line" d="M535 280C480 315 420 325 380 355"/><path class="async" d="M545 430H635"/><text class="s" x="553" y="414">allowlisted metadata</text><path class="async" d="M1015 430H1095"/>

<rect class="card" x="155" y="620" width="310" height="125"/><text class="h" x="185" y="660">SOC case store</text><text class="b" x="185" y="690">campaign · state · evidence timeline</text><text class="s" x="185" y="716">analyst notes · review · audit</text>
<rect class="card teal" x="565" y="620" width="360" height="125"/><text class="h" x="595" y="660">Post-event triage</text><text class="b" x="595" y="690">joins evidence by request ID</text><text class="s" x="595" y="716">rules authoritative · optional LLM narration</text>
<rect class="card teal" x="1025" y="620" width="345" height="125"/><text class="h" x="1055" y="660">Alloy → Loki → Grafana</text><text class="b" x="1055" y="690">event search · dashboards · alerts</text><rect class="pt" x="1055" y="708" width="134" height="21" rx="10"/><text class="pill tt" x="1068" y="723">OBSERVABILITY</text>
<path class="async" d="M1235 495V610"/><path class="line" d="M1020 675H930"/><path class="line" d="M560 675H470"/>
<line x1="55" y1="790" x2="1380" y2="790" stroke="#cbd5e1"/><text class="s" x="55" y="820">Candidate inference stays outside the cache-critical path and cannot change Nginx behavior.</text>
</svg>
