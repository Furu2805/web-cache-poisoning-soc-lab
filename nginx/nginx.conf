worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/json;
    client_max_body_size 64k;
    proxy_cache_path /var/cache/nginx/lab levels=1:2 keys_zone=lab:20m max_size=100m inactive=2m;
    # Stage 9 schema: retain correlation and operational evidence while never
    # persisting cookie values, raw query/payloads, or complete request headers.
    log_format lab escape=json '{"schema":"fusion-nginx-access-v1",'
        '"timestamp":"$time_iso8601","request_id":"$request_id",'
        '"scope":"$lab_log_scope","mode":"$lab_log_mode",'
        '"scenario":"$fusion_log_scenario","client_ip":"$remote_addr",'
        '"method":"$request_method","host":"$host","uri_path":"$uri",'
        '"query_present":$lab_log_query_present,"status":$status,'
        '"cache_status":"$lab_log_cache_status",'
        '"detector_prediction":"$fusion_log_decision",'
        '"detector_action":"$fusion_log_action",'
        '"detector_recommendation":"$fusion_log_recommendation",'
        '"anomaly_score":"$fusion_log_score",'
        '"detector_request_id":"$fusion_log_detector_request_id",'
        '"detector_ms":"$fusion_log_ms",'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout lab;
    access_log /var/log/nginx/fusion-nginx-access.jsonl lab;

    # Teaching cache parser: strips a UTM parameter in this documented shape.
    # The origin still reads that parameter and reflects it in the local lab.
    map $args $cloak_args {
        default $args;
        ~^id=(?<cloak_id>[^&]+)&utm_(source|medium|campaign|term|content)=[^&]*$ id=$cloak_id;
    }
    map $uri $vulnerable_key {
        default $request_uri;
        /lab/query /lab/query;
        /lab/cloaking /lab/cloaking?$cloak_args;
        /lab/fatget /lab/fatget;
        /lab/shop/query /lab/shop/query;
        /lab/shop/cloaking /lab/shop/cloaking?$cloak_args;
        /lab/shop/fatget /lab/shop/fatget;
    }
    # Cache-key mistakes intentionally limited to Fusion's four local lab
    # variants.  A normal shop URL retains its complete request URI.
    map "$arg_lab:$arg_id" $fusion_cache_key {
        default $request_uri;
        ~^xfh: /?lab=xfh;
        ~^query: /?lab=query;
        ~^utm:(?<fusion_id>[^&]*) /?lab=utm&id=$fusion_id;
        ~^split: /?lab=split;
    }
    map $defense_mode $selected_key {
        default $vulnerable_key;
        hardened $request_uri;
    }
    # Query lab #2: emulate a CDN that excludes only utm_content. Other query
    # parameters remain keyed and can therefore be used as cache busters.
    map $args $query_without_utm_content_start {
        default $args;
        ~^utm_content=[^&]*&(.*)$ $1;
        ~^utm_content=[^&]*$ "";
    }
    map $query_without_utm_content_start $query_cache_args {
        default $query_without_utm_content_start;
        ~^(.*)&utm_content=[^&]*$ $1;
    }
    # Lab #3 uses the same key-normalization mistake for a JSONP resource:
    # preserve every ordinary parameter (including duplicate callbacks), while
    # treating utm_content as an ignored analytics parameter.
    map $args $utm_resource_without_utm_start {
        default $args;
        ~^utm_content=[^&]*&(.*)$ $1;
        ~^utm_content=[^&]*$ "";
    }
    map $utm_resource_without_utm_start $utm_resource_cache_args {
        default $utm_resource_without_utm_start;
        ~^(.*)&utm_content=[^&]*$ $1;
    }
    # Param Miner needs a response differential even when a clean callback
    # object is already cached. This diagnostic header is evaluated per client
    # request, after a cache HIT, and only when the supported UTM parameter is
    # present. It does not participate in the intentionally flawed cache key.
    map $arg_utm_content $utm_content_discovery_header {
        default "";
        ~.+ "active";
    }
    # PortSwigger-style cache-key disclosure is available only to lab #2.
    map $http_pragma $query_cache_key_debug {
        default "";
        ~*x-get-cache-key "$scheme|$host|$uri?$query_cache_args";
    }
    map $defense_mode $forwarded_host {
        default $http_x_forwarded_host;
        hardened $host;
    }
    map $http_x_lab_bypass $manual_bypass {
        default 0;
        1 1;
        true 1;
    }
    map "$defense_mode:$request_method:$http_content_length:$http_transfer_encoding:$http_authorization:$http_cookie" $hard_bypass {
        default 0;
        ~^hardened:(GET|HEAD):0?:::$ 0;
        ~^hardened: 1;
    }
    include /etc/nginx/lab/fusion-detector-mode.conf;
    # Normalize log values across the legacy teaching ports and Fusion. The
    # Fusion mode is explicitly operator-owned; it is never a client header.
    map $server_port $lab_log_scope {
        default legacy;
        8086 fusion;
        8090 fusion;
        8091 fusion;
    }
    map $server_port $lab_log_mode {
        default unknown;
        8080 none;
        8081 rule;
        8082 ml;
        8083 hybrid;
        8084 hardened;
        8085 observe;
        8086 $fusion_detector_mode;
        8090 $fusion_detector_mode;
        8091 $fusion_detector_mode;
    }
    map $uri $fusion_log_scenario {
        default not-fusion;
        ~^/labs/xfh/fixed(?:/|$) xfh-fixed;
        ~^/labs/query/fixed(?:/|$) query-fixed;
        ~^/labs/utm/fixed(?:/|$) utm-fixed;
        ~^/labs/fatget/fixed(?:/|$) fatget-fixed;
        ~^/labs/xfh(?:/|$) xfh;
        ~^/labs/query(?:/|$) query;
        ~^/labs/utm(?:/|$) utm;
        ~^/labs/fatget(?:/|$) fatget;
    }
    map $args $lab_log_query_present {
        "" false;
        default true;
    }
    map $upstream_cache_status $lab_log_cache_status {
        "" not-cacheable;
        default $upstream_cache_status;
    }
    # The auth subrequest has no detector headers in off mode. Represent that
    # state explicitly rather than emitting blank JSON fields.
    map $fusion_detector_decision $fusion_log_decision {
        "" not-evaluated;
        default $fusion_detector_decision;
    }
    map $fusion_detector_action $fusion_log_action {
        "" not-evaluated;
        default $fusion_detector_action;
    }
    map $fusion_detector_recommendation $fusion_log_recommendation {
        "" not-evaluated;
        default $fusion_detector_recommendation;
    }
    map $fusion_anomaly_score $fusion_log_score {
        "" not-evaluated;
        default $fusion_anomaly_score;
    }
    map $fusion_detector_request_id $fusion_log_detector_request_id {
        "" not-evaluated;
        default $fusion_detector_request_id;
    }
    map $fusion_detector_ms $fusion_log_ms {
        "" not-evaluated;
        default $fusion_detector_ms;
    }
    map $host $valid_host {
        default 0;
        localhost 1;
        127.0.0.1 1;
        lab.test 1;
        proxy 1;
    }
    upstream origin { server backend:8000; keepalive 16; }
    upstream decision_service { server detector:8001; keepalive 16; }
    upstream triage_service { server triage:8002; keepalive 8; }
    upstream fusion_backend { server fusion-backend:8000; keepalive 16; }
    upstream fusion_storefront { server fusion-storefront:80; keepalive 16; }
    include /etc/nginx/lab/servers.conf;
}
