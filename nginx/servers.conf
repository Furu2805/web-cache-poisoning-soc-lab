# The unmodified Fusion Electronics application is a separate, normal shop
# origin in the same Docker lab. It is exposed through Nginx only.
server {
    listen 8086;
    # Local-only ports published by Compose solely for the repeatable G14
    # measurement. They share every Fusion route with :8086; only the
    # operator-owned detector mode differs through $server_port.
    listen 8090;
    listen 8091;
    server_name _;
    # Preserve parent-request values for the auth subrequest metadata contract.
    set $fusion_request_id $request_id;
    set $fusion_original_method $request_method;
    set $fusion_original_uri $request_uri;
    # Browser conditional requests turn otherwise useful lab responses into
    # 304s. Hide validators only on this teaching origin so Burp can always
    # inspect the cached HTML/JS body and its X-Cache-Status.
    proxy_hide_header ETag;
    proxy_set_header If-None-Match "";
    proxy_set_header If-Modified-Since "";

    location = /_fusion_inspect {
        internal;
        # In off mode this is a local 204: detector is not contacted and the
        # auth subrequest has no cache decision to apply.
        if ($fusion_detector_mode = off) { return 204; }
        proxy_pass http://decision_service/inspect;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        proxy_set_header Connection "";
        proxy_set_header Host detector;
        proxy_set_header X-Request-ID $fusion_request_id;
        proxy_set_header X-Fusion-Detector-Mode $fusion_detector_mode;
        proxy_set_header X-Meta-Method $fusion_original_method;
        proxy_set_header X-Meta-URI $fusion_original_uri;
        proxy_set_header X-Meta-Host $http_host;
        proxy_set_header X-Meta-User-Agent $http_user_agent;
        proxy_set_header X-Meta-Accept $http_accept;
        proxy_set_header X-Meta-Accept-Language $http_accept_language;
        proxy_set_header X-Meta-Cookie $http_cookie;
        proxy_set_header X-Meta-Content-Type $http_content_type;
        proxy_set_header X-Meta-Content-Length $http_content_length;
        proxy_set_header X-Meta-Transfer-Encoding $http_transfer_encoding;
        proxy_set_header X-Meta-X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Meta-X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Meta-X-Original-URL $http_x_original_url;
        proxy_set_header X-Meta-X-Rewrite-URL $http_x_rewrite_url;
        proxy_set_header X-Meta-X-HTTP-Method-Override $http_x_http_method_override;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
    }

    location @fusion_detector_unavailable {
        # Fail-open for application availability, fail-closed for cache:
        # never let a detector timeout/error read or populate shared cache.
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Host $fusion_forwarded_host;
        proxy_set_header X-Forwarded-Proto $fusion_forwarded_proto;
        proxy_set_header X-Lab-Hardened $fusion_lab_hardened;
        proxy_pass http://fusion_backend;
        add_header X-Cache-Status BYPASS always;
        add_header X-Fusion-Detector-Mode $fusion_detector_mode always;
        add_header X-Fusion-Detector-Decision detector-unavailable always;
        add_header X-Fusion-Detector-Action bypass-no-cache always;
        add_header X-Fusion-Cache-Bypass 1 always;
        add_header X-Request-ID $request_id always;
    }

    location = /lab-store {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        # The local lab is served over HTTP; derive the protocol from the
        # actual connection so a local exploit host on :8087 is loadable even
        # when the student only supplies X-Forwarded-Host.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache lab;
        proxy_cache_key "fusion|$scheme|$host|$fusion_cache_key";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_pass http://fusion_backend;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Lab-Scenario $arg_lab always;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://fusion_backend;
    }

    # Each Access Lab URL isolates itself naturally because its path is in the
    # cache key. Only the intentional input is excluded for that one lab.
    # Avoid Nginx's automatic trailing-slash 301 so Burp sees the lab request
    # itself as a 200 response even if a student omits the final slash.
    location = /labs/xfh { rewrite ^ /labs/xfh/ last; }
    location = /labs/query { rewrite ^ /labs/query/ last; }
    location = /labs/utm { rewrite ^ /labs/utm/ last; }
    location = /labs/fatget { rewrite ^ /labs/fatget/ last; }

    location /labs/xfh/fixed/ {
        include /etc/nginx/lab/fusion-detector-auth.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Lab-Hardened 1;
        proxy_cache lab;
        proxy_cache_key "$scheme|$host|$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30s;
        proxy_cache_bypass $fusion_detector_bypass;
        proxy_no_cache $fusion_detector_bypass;
        proxy_pass http://fusion_backend;
        add_header X-Lab-Patched xfh always;
        include /etc/nginx/lab/fusion-detector-response-headers.conf;
        add_header X-Request-ID $request_id always;
    }

    location /labs/xfh/ {
        include /etc/nginx/lab/fusion-detector-auth.conf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache lab;
        proxy_cache_key "$scheme|$host|$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_bypass $fusion_detector_bypass;
        proxy_no_cache $fusion_detector_bypass;
        proxy_pass http://fusion_backend;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Lab-Scenario xfh always;
        include /etc/nginx/lab/fusion-detector-response-headers.conf;
        add_header X-Request-ID $request_id always;
    }

    location /labs/query/fixed/ {
        include /etc/nginx/lab/fusion-detector-auth.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Lab-Hardened 1;
        proxy_cache lab;
        proxy_cache_key "$scheme|$host|$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30s;
        proxy_cache_bypass $fusion_detector_bypass;
        proxy_no_cache $fusion_detector_bypass;
        proxy_pass http://fusion_backend;
        add_header X-Lab-Patched query always;
        include /etc/nginx/lab/fusion-detector-response-headers.conf;
        add_header X-Request-ID $request_id always;
    }

    location /labs/query/ {
        include /etc/nginx/lab/fusion-detector-auth.conf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache lab;
        # Deliberate lab flaw: only utm_content is omitted. The rest of the
        # query string remains keyed, so a normal parameter is a cache buster.
        proxy_cache_key "$scheme|$host|$uri?$query_cache_args";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_bypass $fusion_detector_bypass;
        proxy_no_cache $fusion_detector_bypass;
        proxy_pass http://fusion_backend;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Cache-Key $query_cache_key_debug always;
        add_header X-Lab-Scenario query always;
        include /etc/nginx/lab/fusion-detector-response-headers.conf;
        add_header X-Request-ID $request_id always;
    }

    location = /labs/utm/fixed/js/geolocate.js {
        include /etc/nginx/lab/fusion-detector-auth.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Lab-Hardened 1;
        proxy_cache lab;
        proxy_cache_key "$scheme|$host|$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30s;
        proxy_cache_bypass $fusion_detector_bypass;
        proxy_no_cache $fusion_detector_bypass;
        proxy_pass http://fusion_backend;
        add_header X-Lab-Patched utm always;
        include /etc/nginx/lab/fusion-detector-response-headers.conf;
        add_header X-Request-ID $request_id always;
    }

    location /labs/utm/fixed/ {
        include /etc/nginx/lab/fusion-detector-auth.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Lab-Hardened 1;
        proxy_cache lab;
        proxy_cache_key "$scheme|$host|$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30s;
        proxy_cache_bypass $fusion_detector_bypass;
        proxy_no_cache $fusion_detector_bypass;
        proxy_pass http://fusion_backend;
        add_header X-Lab-Patched utm always;
        include /etc/nginx/lab/fusion-detector-response-headers.conf;
        add_header X-Request-ID $request_id always;
    }

    location = /labs/utm/js/geolocate.js {
        include /etc/nginx/lab/fusion-detector-auth.conf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache lab;
        # The cache retains ordinary parameters, including duplicate callback
        # names, but ignores the analytics parameter utm_content. A callback
        # hidden after a semicolon in utm_content is therefore unkeyed here.
        proxy_cache_key "$scheme|$host|$uri?$utm_resource_cache_args";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_bypass $fusion_detector_bypass;
        proxy_no_cache $fusion_detector_bypass;
        proxy_pass http://fusion_backend;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Cache-Key "$scheme|$host|$uri?$utm_resource_cache_args" always;
        add_header X-Geo-Campaign $utm_content_discovery_header always;
        add_header X-Lab-Scenario utm-cloaking always;
        include /etc/nginx/lab/fusion-detector-response-headers.conf;
        add_header X-Request-ID $request_id always;
    }

    location /labs/utm/ {
        include /etc/nginx/lab/fusion-detector-auth.conf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache lab;
        proxy_cache_key "$scheme|$host|$uri|id=$arg_id";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_bypass $fusion_detector_bypass;
        proxy_no_cache $fusion_detector_bypass;
        proxy_pass http://fusion_backend;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Lab-Scenario utm always;
        include /etc/nginx/lab/fusion-detector-response-headers.conf;
        add_header X-Request-ID $request_id always;
    }

    location = /labs/fatget/fixed/js/geolocate.js {
        include /etc/nginx/lab/fusion-detector-auth.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Lab-Hardened 1;
        proxy_cache lab;
        proxy_cache_key "$scheme|$host|$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30s;
        proxy_cache_bypass $fusion_detector_bypass;
        proxy_no_cache $fusion_detector_bypass;
        proxy_pass http://fusion_backend;
        add_header X-Lab-Patched fatget always;
        include /etc/nginx/lab/fusion-detector-response-headers.conf;
        add_header X-Request-ID $request_id always;
    }

    location /labs/fatget/fixed/ {
        include /etc/nginx/lab/fusion-detector-auth.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Lab-Hardened 1;
        proxy_cache lab;
        proxy_cache_key "$scheme|$host|$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30s;
        proxy_cache_bypass $fusion_detector_bypass;
        proxy_no_cache $fusion_detector_bypass;
        proxy_pass http://fusion_backend;
        add_header X-Lab-Patched fatget always;
        include /etc/nginx/lab/fusion-detector-response-headers.conf;
        add_header X-Request-ID $request_id always;
    }

    location = /labs/fatget/js/geolocate.js {
        include /etc/nginx/lab/fusion-detector-auth.conf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache lab;
        # Deliberate flaw: a GET body is forwarded to the origin but omitted
        # from the cache key; only the URL callback is keyed.
        proxy_cache_key "$scheme|$host|$uri|callback=$arg_callback";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_bypass $fusion_detector_bypass;
        proxy_no_cache $fusion_detector_bypass;
        proxy_pass http://fusion_backend;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Cache-Key "$scheme|$host|$uri|callback=$arg_callback" always;
        add_header X-Lab-Scenario fatget always;
        include /etc/nginx/lab/fusion-detector-response-headers.conf;
        add_header X-Request-ID $request_id always;
    }

    location /labs/fatget/ {
        include /etc/nginx/lab/fusion-detector-auth.conf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache lab;
        proxy_cache_key "$scheme|$host|$uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_bypass $fusion_detector_bypass;
        proxy_no_cache $fusion_detector_bypass;
        proxy_pass http://fusion_backend;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Lab-Scenario fatget always;
        include /etc/nginx/lab/fusion-detector-response-headers.conf;
        add_header X-Request-ID $request_id always;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://fusion_storefront;
    }
}
