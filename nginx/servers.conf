server {
    listen 8080;
    server_name _;
    set $defense_mode none;
    include /etc/nginx/lab/locations.conf;
    location /lab/ {
        if ($valid_host = 0) { return 400; }
        set $original_method $request_method;
        set $original_uri $request_uri;
        auth_request off;
        auth_request_set $bypass $upstream_http_x_bypass;
        auth_request_set $decision $upstream_http_x_decision;
        auth_request_set $anomaly_score $upstream_http_x_anomaly_score;
        auth_request_set $detector_ms $upstream_http_x_detector_ms;
        error_page 500 502 503 504 = @detector_unavailable;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_cache lab;
        proxy_cache_key "$defense_mode|$scheme|$host|$selected_key";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_bypass $bypass $hard_bypass $manual_bypass;
        proxy_no_cache $bypass $hard_bypass $manual_bypass;
        proxy_pass http://origin;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Defense-Mode $defense_mode always;
        add_header X-Decision $decision always;
        add_header X-Anomaly-Score $anomaly_score always;
        add_header X-Detector-Ms $detector_ms always;
        add_header X-Request-ID $request_id always;
    }
}

