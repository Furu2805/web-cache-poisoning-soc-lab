# Fusion operator-owned feature flag. This must never be derived from a client
# header, query parameter, cookie, or any other attacker-controlled input.
#
# The normal teaching origin remains off. Two localhost-only Stage 14 ports
# use the same Fusion server block with a fixed operator-owned mode, allowing
# a paired benchmark without editing/reloading the C4 lab configuration.
# Client headers, query parameters and cookies never select these values.
map $server_port $fusion_detector_mode {
    default off;
    8086 off;
    8090 observe;
    8091 enforce;
}

# Fallback routing must preserve fixed-route behavior while the detector is
# unavailable: never forward a client supplied XFH to the XFH fixed variant.
map $uri $fusion_lab_hardened {
    default "";
    ~^/labs/(?:xfh|query|utm|fatget)/fixed/ 1;
}
map $uri $fusion_forwarded_host {
    default $http_x_forwarded_host;
    ~^/labs/xfh/fixed/ "";
}
map $uri $fusion_forwarded_proto {
    default $scheme;
    ~^/labs/xfh/fixed/ "";
}
