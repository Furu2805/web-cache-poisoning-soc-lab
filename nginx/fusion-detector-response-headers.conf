# These response headers are teaching/observability evidence. They expose no
# model input values and are not used as cache-key material.
add_header X-Fusion-Detector-Mode $fusion_detector_mode always;
add_header X-Fusion-Detector-Decision $fusion_detector_decision always;
add_header X-Fusion-Detector-Action $fusion_detector_action always;
add_header X-Fusion-Detector-Recommendation $fusion_detector_recommendation always;
add_header X-Fusion-Cache-Bypass $fusion_detector_bypass always;
add_header X-Anomaly-Score $fusion_anomaly_score always;
add_header X-Detector-Ms $fusion_detector_ms always;
add_header X-Fusion-Detector-Request-ID $fusion_detector_request_id always;
