location = /health {
    access_log off;
    return 200 '{"ok":true}';
}

location = /_ui_health {
    proxy_pass http://decision_service/health;
    proxy_set_header Host detector;
    proxy_connect_timeout 1s;
    proxy_read_timeout 2s;
}

# Serve the repository's CacheShield/SOC UI separately from the storefront
# that owns the legacy root route.
location = /soc {
    return 308 /soc/;
}

location /soc/ {
    if ($valid_host = 0) { return 400; }
    alias /usr/share/nginx/html/;
    index index.html;
}

location /soc-assets/ {
    if ($valid_host = 0) { return 400; }
    alias /usr/share/nginx/html/;
}

# Local analyst workspace API. The Compose proxy binds only to loopback; this
# route does not add authentication and must not be exposed in a deployment.
location /soc-api/ {
    if ($valid_host = 0) { return 400; }
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host triage;
    proxy_pass http://triage_service/;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
}

# Authentication is deliberately never cacheable. It is separate from the
# shared-cache target at / so session cookies cannot leak through the cache.
location /auth/ {
    if ($valid_host = 0) { return 400; }
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_pass http://origin;
}

location = /login {
    if ($valid_host = 0) { return 400; }
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://origin;
}

# Cacheable website endpoints used by the phase-1 Home/Product/Search/News UI.
# X-Lab-Bypass: 1 is an explicit teaching control for observing BYPASS.
location /api/ {
    if ($valid_host = 0) { return 400; }
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Host $forwarded_host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_cache lab;
    proxy_cache_key "$defense_mode|content|$scheme|$host|$request_uri";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 30s;
    proxy_cache_lock on;
    proxy_cache_bypass $manual_bypass;
    proxy_no_cache $manual_bypass;
    proxy_pass http://origin;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header X-Defense-Mode $defense_mode always;
    add_header X-Request-ID $request_id always;
    add_header X-Cache-Key-Profile "scheme|host|request_uri" always;
}

location = /_inspect {
    internal;
    proxy_pass http://decision_service/check;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";
    proxy_set_header Host detector;
    proxy_set_header X-Lab-Mode $defense_mode;
    proxy_set_header X-Lab-Record-ID $http_x_lab_record_id;
    proxy_set_header X-Meta-Method $original_method;
    proxy_set_header X-Meta-Uri $original_uri;
    proxy_set_header X-Meta-Host $http_host;
    proxy_set_header X-Meta-User-Agent $http_user_agent;
    proxy_set_header X-Meta-Accept $http_accept;
    proxy_set_header X-Meta-Accept-Language $http_accept_language;
    proxy_set_header X-Meta-Cookie $http_cookie;
    proxy_set_header X-Meta-Content-Type $http_content_type;
    proxy_set_header X-Meta-Content-Length $http_content_length;
    proxy_set_header X-Meta-Transfer-Encoding $http_transfer_encoding;
    proxy_set_header X-Meta-X-Forwarded-Host $http_x_forwarded_host;
    proxy_set_header X-Meta-X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Meta-X-Original-URL $http_x_original_url;
    proxy_set_header X-Meta-X-Rewrite-URL $http_x_rewrite_url;
    proxy_set_header X-Meta-X-HTTP-Method-Override $http_x_http_method_override;
    proxy_connect_timeout 1s;
    proxy_read_timeout 2s;
}

location @detector_unavailable {
    # An auth subrequest transport failure must not populate the cache.
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Host $forwarded_host;
    proxy_pass http://origin;
    add_header X-Cache-Status BYPASS always;
    add_header X-Defense-Mode $defense_mode always;
    add_header X-Decision detector-unavailable always;
    add_header X-Request-ID $request_id always;
}

# The dashboard and every asset are proxied through the cache as well.  This
# makes a browser/Burp request to GET / visibly progress from MISS to HIT,
# rather than bypassing the lab by being served directly from Nginx's disk.
location = / {
    if ($valid_host = 0) { return 400; }
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Host $forwarded_host;
    proxy_cache lab;
    proxy_cache_key "$defense_mode|page|$scheme|$host|$request_uri";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 30s;
    proxy_cache_lock on;
    proxy_cache_bypass $manual_bypass;
    proxy_no_cache $manual_bypass;
    proxy_pass http://origin;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header X-Defense-Mode $defense_mode always;
    add_header X-Request-ID $request_id always;
    add_header X-Cache-Key-Profile "scheme|host|request_uri" always;
}

location /assets/ {
    if ($valid_host = 0) { return 400; }
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_cache lab;
    proxy_cache_key "$defense_mode|asset|$scheme|$host|$request_uri";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 30s;
    proxy_cache_lock on;
    proxy_cache_bypass $manual_bypass;
    proxy_no_cache $manual_bypass;
    proxy_pass http://origin;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header X-Defense-Mode $defense_mode always;
    add_header X-Cache-Key-Profile "scheme|host|request_uri" always;
}

location / { return 404; }
