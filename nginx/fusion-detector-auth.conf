# Included only by Fusion /labs/* cache locations on port 8086.
# The local gate returns 204 without contacting FastAPI when mode=off. In
# observe/enforce it calls /inspect and exposes the explicit response headers.
auth_request /_fusion_inspect;
auth_request_set $fusion_detector_bypass $upstream_http_x_fusion_cache_bypass;
auth_request_set $fusion_detector_decision $upstream_http_x_fusion_classification;
auth_request_set $fusion_detector_action $upstream_http_x_fusion_action;
auth_request_set $fusion_detector_recommendation $upstream_http_x_fusion_recommended_cache_action;
auth_request_set $fusion_anomaly_score $upstream_http_x_anomaly_score;
auth_request_set $fusion_detector_ms $upstream_http_x_detector_ms;
auth_request_set $fusion_detector_request_id $upstream_http_x_request_id;
error_page 500 502 503 504 = @fusion_detector_unavailable;
